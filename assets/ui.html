<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NOVA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
:root{
  --bg:#faf9f5; --panel:#ffffff; --soft:#f2f0ea; --soft2:#eae7df;
  --line:#e4e0d6; --line2:#d6d1c4;
  --ink:#1f1d1a; --ink2:#4a453d; --dim:#8a8377; --dim2:#a8a196;
  --acc:#d97757; --acc2:#c4633f; --accsoft:#fdf1ec;
  --ok:#2d9c6f; --danger:#d1453b;
  --serif:Georgia,'Times New Roman',serif;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.7}

/* ══════ header ══════ */
header{display:flex;align-items:center;gap:8px;padding:11px 12px;flex:none;
  background:var(--bg);border-bottom:1px solid var(--line);z-index:20}
.ib{background:none;border:none;color:var(--ink2);width:38px;height:38px;border-radius:10px;
  flex:none;display:grid;place-items:center;transition:.15s}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.ib:active{background:var(--soft);transform:scale(.9)}
.brand{flex:1;display:flex;align-items:center;justify-content:center;gap:7px}
.bstar{width:20px;height:20px;flex:none}
.bstar svg{width:100%;height:100%;fill:var(--acc)}
.brand b{font-size:16px;font-weight:600;letter-spacing:.3px}
.brand .cv{display:flex;align-items:center;gap:3px;color:var(--dim);font-size:11px}
.brand .cv svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.4}

/* ══════ chat ══════ */
#chat{flex:1;overflow-y:auto;padding:16px 14px 8px;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain}
.msg{margin-bottom:22px;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(7px)}}
.msg.me{display:flex;justify-content:flex-end}
.msg.me .bub{background:var(--soft);border-radius:19px 19px 5px 19px;padding:11px 16px;
  max-width:85%;-webkit-user-select:text;user-select:text;font-size:15.5px;color:var(--ink)}
.msg.ai{display:flex;gap:11px}
.av{width:27px;height:27px;flex:none;margin-top:2px}
.av svg{width:100%;height:100%;fill:var(--acc)}
.col{flex:1;min-width:0}
.bub{-webkit-user-select:text;user-select:text;font-size:15.5px;color:var(--ink);
  word-wrap:break-word;overflow-wrap:anywhere}

/* markdown */
.bub p{margin:0 0 11px}
.bub p:last-child{margin-bottom:0}
.bub h1,.bub h2,.bub h3{font-family:var(--serif);font-weight:600;color:var(--ink);
  line-height:1.35;margin:18px 0 9px}
.bub h1{font-size:23px}.bub h2{font-size:20px}.bub h3{font-size:17.5px}
.bub h1:first-child,.bub h2:first-child,.bub h3:first-child{margin-top:0}
.bub ul,.bub ol{margin:9px 0 12px;padding-left:22px}
.bub li{margin-bottom:6px}
.bub li::marker{color:var(--acc)}
.bub blockquote{border-left:2.5px solid var(--acc);padding:2px 0 2px 14px;margin:12px 0;
  color:var(--ink2);font-style:italic}
.bub hr{border:none;border-top:1px solid var(--line);margin:16px 0}
.bub a{color:var(--acc2);text-decoration:underline;text-underline-offset:2px}
.bub strong{font-weight:650;color:var(--ink)}
.bub code{background:var(--soft);padding:2px 6px;border-radius:5px;font-size:13.5px;
  font-family:ui-monospace,Menlo,monospace;color:#b8452c;border:1px solid var(--line)}
.tbl{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:11px}
.bub table{border-collapse:collapse;width:100%;font-size:14px}
.bub th{background:var(--soft);padding:10px 13px;text-align:left;font-weight:600;
  white-space:nowrap;border-bottom:1px solid var(--line)}
.bub td{padding:10px 13px;border-bottom:1px solid var(--line)}
.bub tr:last-child td{border-bottom:none}

/* code block */
.cb{margin:13px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background:var(--panel)}
.cbh{display:flex;align-items:center;justify-content:space-between;padding:8px 13px;
  background:var(--soft);border-bottom:1px solid var(--line)}
.cbh span{font-size:11px;color:var(--dim);font-family:ui-monospace,monospace;
  letter-spacing:.7px;text-transform:uppercase;font-weight:600}
.cbb{display:flex;align-items:center;gap:5px;background:none;border:none;
  color:var(--ink2);font-size:11.5px;font-weight:600;font-family:inherit;padding:4px 7px;
  border-radius:6px}
.cbb svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.cbb:active{background:var(--soft2)}
.cb pre{padding:14px;overflow-x:auto;font-family:ui-monospace,Menlo,monospace;
  font-size:12.8px;line-height:1.7;color:#2b2823;-webkit-user-select:text;user-select:text}
.k{color:#a0439c}.s{color:#2d7d4f}.c{color:#9a9488;font-style:italic}.n{color:#b8452c}

/* tool chip */
.tc{display:inline-flex;align-items:center;gap:8px;background:var(--panel);
  border:1px solid var(--line);border-radius:11px;padding:8px 13px;margin:7px 0;
  font-size:13px;color:var(--ink2)}
.tc svg{width:14px;height:14px;stroke:var(--acc);fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.tc.done svg{stroke:var(--ok)}
.spin{width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--acc);
  border-radius:50%;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.typ{display:flex;gap:5px;padding:6px 0}
.typ i{width:7px;height:7px;border-radius:50%;background:var(--dim2);animation:bob 1.3s infinite}
.typ i:nth-child(2){animation-delay:.16s}.typ i:nth-child(3){animation-delay:.32s}
@keyframes bob{0%,60%,100%{opacity:.3}30%{opacity:1;transform:translateY(-4px)}}
.cur{display:inline-block;width:2.5px;height:16px;background:var(--acc);vertical-align:-3px;
  animation:bl .9s steps(2) infinite;margin-left:2px;border-radius:1px}
@keyframes bl{50%{opacity:0}}

/* actions */
.acts{display:flex;gap:3px;margin-top:9px;flex-wrap:wrap}
.act{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--dim);
  border-radius:8px;padding:6px 9px;font-size:12px;font-family:inherit;font-weight:500}
.act svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.act:active{background:var(--soft);color:var(--ink)}

/* ══════ hero ══════ */
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:76%;text-align:center;padding:20px 18px;animation:fade .5s}
.hstar{width:46px;height:46px;margin-bottom:20px;animation:spin 26s linear infinite}
.hstar svg{width:100%;height:100%;fill:var(--acc)}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h2{font-family:var(--serif);font-size:31px;font-weight:400;line-height:1.32;
  color:var(--ink);margin-bottom:9px;letter-spacing:-.4px}
.hero p{color:var(--dim);font-size:13.5px;margin-bottom:30px}
.sug{display:grid;gap:8px;width:100%;max-width:400px}
.sg{display:flex;align-items:center;gap:13px;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:13px 15px;text-align:left;
  font-family:inherit;animation:fade .45s backwards}
.sg:nth-child(1){animation-delay:.05s}.sg:nth-child(2){animation-delay:.1s}
.sg:nth-child(3){animation-delay:.15s}.sg:nth-child(4){animation-delay:.2s}
.sg:active{background:var(--soft);transform:scale(.98)}
.sg .si{width:19px;height:19px;flex:none}
.sg .si svg{width:100%;height:100%;stroke:var(--acc);fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.sg .st{flex:1;min-width:0;font-size:14.5px;color:var(--ink);font-weight:500}
.sg .ar{width:15px;height:15px;flex:none;opacity:.35}
.sg .ar svg{width:100%;height:100%;stroke:var(--ink);fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}

/* ══════ input ══════ */
footer{padding:8px 12px 12px;background:var(--bg);flex:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;
  padding:6px 6px 6px 8px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card.foc{border-color:var(--line2);box-shadow:0 2px 12px rgba(0,0,0,.07)}
textarea{width:100%;background:none;border:none;color:var(--ink);padding:9px 8px 4px;
  font:inherit;font-size:16px;resize:none;max-height:130px;min-height:38px;outline:none;
  -webkit-user-select:text;user-select:text;line-height:1.55}
textarea::placeholder{color:var(--dim2)}
.crow{display:flex;align-items:center;gap:4px;padding:2px 2px 0}
.cb2{width:34px;height:34px;border-radius:11px;border:none;background:none;color:var(--dim);
  flex:none;display:grid;place-items:center}
.cb2 svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.cb2:active{background:var(--soft)}
.cb2.rec{background:var(--danger);color:#fff;animation:rp 1.1s infinite}
@keyframes rp{50%{box-shadow:0 0 0 8px rgba(209,69,59,.13)}}
.mtag{display:flex;align-items:center;gap:5px;background:var(--soft);border:none;
  border-radius:16px;padding:6px 11px;font-family:inherit;font-size:12px;color:var(--ink2);
  font-weight:500;max-width:150px}
.mtag span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtag svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2;flex:none}
.mtag:active{background:var(--soft2)}
.sp{flex:1}
.snd{width:36px;height:36px;border-radius:12px;border:none;flex:none;display:grid;
  place-items:center;background:var(--acc);transition:.15s}
.snd svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2.3;
  stroke-linecap:round;stroke-linejoin:round}
.snd:active{transform:scale(.9);background:var(--acc2)}
.snd:disabled{background:var(--soft2)}
.snd:disabled svg{stroke:var(--dim2)}
.snd.stop svg{fill:#fff}



/* ══════ attach tiles (Camera / Photos / Files) ══════ */
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;padding:2px 1px 12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:15px;
  padding:17px 6px 13px;display:flex;flex-direction:column;align-items:center;gap:9px;
  font-family:inherit}
.tile .tc2{width:44px;height:44px;border-radius:50%;background:var(--soft);
  display:grid;place-items:center}
.tile .tc2 svg{width:21px;height:21px;stroke:var(--ink);fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.tile span{font-size:14px;color:var(--ink);font-weight:500}
.tile:active{background:var(--soft);transform:scale(.97)}

/* staged attachment chips above the composer */
.atts{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;
  -webkit-overflow-scrolling:touch}
.atts:empty{display:none}
.att{display:flex;align-items:center;gap:8px;background:var(--soft);
  border:1px solid var(--line);border-radius:12px;padding:7px 9px;flex:none;
  max-width:190px;animation:fade .2s}
.att .ai2{width:17px;height:17px;flex:none}
.att .ai2 svg{width:100%;height:100%;stroke:var(--acc);fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.att .an{flex:1;min-width:0;font-size:12.5px;color:var(--ink);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.att .as{font-size:10.5px;color:var(--dim);flex:none}
.att .ax{flex:none;color:var(--dim);padding:2px}
.att .ax svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}
.att .ax:active{color:var(--danger)}

/* attachment markers inside a sent bubble */
.mtag2{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.05);
  border-radius:9px;padding:5px 9px;margin:5px 4px 0 0;font-size:12px;color:var(--ink2)}
.mtag2 svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.note{display:flex;align-items:center;gap:8px;background:var(--accsoft);
  border:1px solid #f2d4c6;border-radius:11px;padding:9px 12px;margin:8px 0;
  font-size:12.5px;color:var(--acc2)}
.note svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;flex:none}

/* ══════ bottom sheet ══════ */
.bs{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg);
  border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  transform:translateY(105%);transition:transform .3s cubic-bezier(.32,.85,.36,1);
  max-height:82%;display:flex;flex-direction:column;box-shadow:0 -6px 26px rgba(0,0,0,.1)}
.bs.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:9px auto 4px;
  flex:none}
.bsh{padding:8px 18px 12px;font-family:var(--serif);font-size:19px;flex:none}
.bsb{overflow-y:auto;padding:0 12px 26px}
.bi{width:100%;display:flex;align-items:center;gap:13px;padding:13px 13px;border:none;
  background:none;border-radius:13px;font-family:inherit;text-align:left;margin-bottom:2px}
.bi .bic{width:38px;height:38px;border-radius:11px;background:var(--soft);flex:none;
  display:grid;place-items:center}
.bi .bic svg{width:18px;height:18px;stroke:var(--ink2);fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.bi .bt{flex:1;min-width:0}
.bi .bt b{display:block;font-size:15px;font-weight:600;color:var(--ink)}
.bi .bt small{color:var(--dim);font-size:12.5px}
.bi:active{background:var(--soft)}
.bi .sw{margin-left:auto}
.bsep{height:1px;background:var(--line);margin:9px 13px}
.cb2.plus{color:var(--ink2)}

/* ══════ sheets ══════ */
.scrim{position:fixed;inset:0;background:rgba(31,29,26,.32);z-index:50;opacity:0;
  visibility:hidden;transition:.26s}
.scrim.on{opacity:1;visibility:visible}
.sheet{position:fixed;top:0;bottom:0;width:87%;max-width:370px;background:var(--bg);
  z-index:60;display:flex;flex-direction:column;
  transition:transform .3s cubic-bezier(.32,.85,.36,1)}
.sheet.left{left:0;border-right:1px solid var(--line);transform:translateX(-103%)}
.sheet.right{right:0;border-left:1px solid var(--line);transform:translateX(103%)}
.sheet.left.on,.sheet.right.on{transform:translateX(0)}
.sh{padding:16px 15px 13px;display:flex;align-items:center;justify-content:space-between;
  flex:none}
.sh b{font-family:var(--serif);font-size:22px;font-weight:400}
.sb{flex:1;overflow-y:auto;padding:0 13px 30px}

.nb{width:100%;display:flex;align-items:center;gap:11px;padding:12px 13px;border:none;
  background:none;border-radius:11px;font-family:inherit;font-size:15px;color:var(--acc);
  font-weight:500;margin-bottom:6px}
.nb svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.nb:active{background:var(--accsoft)}
.mi{width:100%;display:flex;align-items:center;gap:11px;padding:12px 13px;border:none;
  background:none;border-radius:11px;font-family:inherit;font-size:15px;color:var(--ink);
  font-weight:500;margin-bottom:2px}
.mi svg{width:19px;height:19px;stroke:var(--ink2);fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.mi:active{background:var(--soft)}
.sect{font-size:11.5px;color:var(--dim);font-weight:600;letter-spacing:.4px;
  padding:18px 13px 8px}
.itm{display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:11px;
  margin-bottom:1px}
.itm.sel{background:var(--soft)}
.itm .ct{flex:1;min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;color:var(--ink)}
.itm .cx{color:var(--dim2);padding:5px;flex:none}
.itm .cx svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.itm:active{background:var(--soft)}
.foot{border-top:1px solid var(--line);padding:13px 15px;display:flex;align-items:center;
  gap:11px;flex:none}
.foot .ava{width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.foot .fi{flex:1;min-width:0}
.foot .fi b{display:block;font-size:13.5px;font-weight:600}
.foot .fi small{color:var(--dim);font-size:11.5px}

/* settings */
.tabs{display:flex;gap:3px;margin:0 0 18px;background:var(--soft);padding:4px;
  border-radius:12px;position:sticky;top:0;z-index:5}
/* Real buttons, so the tap target is the whole cell and touch feedback is
   immediate. Previously these were bare divs with no cursor and no active
   state, which made a tap that did register feel like one that had not. */
.tb{flex:1;padding:11px 4px;text-align:center;border-radius:9px;font-size:13.5px;
  color:var(--dim);font-weight:500;transition:background .18s,color .18s;
  background:none;border:none;font-family:inherit;cursor:pointer;
  -webkit-tap-highlight-color:transparent;-webkit-appearance:none;appearance:none}
.tb:active{color:var(--ink)}
.tb.on{background:var(--panel);color:var(--ink);font-weight:600;
  box-shadow:0 1px 3px rgba(0,0,0,.07)}

/* group related settings instead of one long undifferentiated column */
.grp{margin-top:22px}
.grp:first-child{margin-top:0}
.grp>.gt{font-size:11.5px;font-weight:600;color:var(--dim);letter-spacing:.04em;
  text-transform:uppercase;margin:0 0 9px 2px}
label{display:block;font-size:12.5px;color:var(--dim);margin:17px 0 7px;font-weight:600}
label:first-child{margin-top:0}
input,select,.ta{width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;color:var(--ink);padding:12px 13px;font:inherit;font-size:15px;
  outline:none;-webkit-user-select:text;user-select:text;transition:.18s}
input:focus,select:focus,.ta:focus{border-color:var(--acc);
  box-shadow:0 0 0 3px var(--accsoft)}
.ta{min-height:200px;resize:vertical;font-size:13.5px;line-height:1.7}
.hint{font-size:12px;color:var(--dim);margin-top:7px;line-height:1.6;word-break:break-word}
.hint a{color:var(--acc2)}
.adv{display:flex;align-items:center;justify-content:space-between;width:100%;
 margin-top:20px;padding:13px 2px;background:none;border:none;border-top:1px solid var(--line);
 color:var(--dim);font-size:14px;font-family:inherit;cursor:pointer}
.adv svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;
 transition:transform .2s}
.adv.on svg{transform:rotate(180deg)}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.mc{padding:7px 12px;border-radius:18px;background:var(--panel);border:1px solid var(--line);
  font-size:11.5px;color:var(--ink2);font-family:ui-monospace,monospace}
.mc.on{border-color:var(--acc);background:var(--accsoft);color:var(--acc2)}

/* key status banner */
.kb{display:flex;align-items:flex-start;gap:11px;background:var(--panel);
  border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:4px}
.kb.ok{background:#f0f9f4;border-color:#c8e6d5}
.kb.warn{background:var(--accsoft);border-color:#f2d4c6}
.kb .ki{width:19px;height:19px;flex:none;margin-top:2px}
.kb .ki svg{width:100%;height:100%;fill:none;stroke-width:2;stroke-linecap:round;
  stroke-linejoin:round}
.kb.ok .ki svg{stroke:var(--ok)}
.kb.warn .ki svg{stroke:var(--acc)}
.kb div{flex:1;min-width:0}
.kb b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.kb span{font-size:12.5px;color:var(--ink2);line-height:1.6}

.row{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;
  background:var(--panel);border:1px solid var(--line);border-radius:13px;margin-top:9px}
.row .rt{flex:1;min-width:0;padding-right:12px}
.row b{font-size:14.5px;font-weight:600;display:block}
.row small{color:var(--dim);font-size:12px}
.sw{width:46px;height:27px;border-radius:15px;background:var(--line2);position:relative;
  flex:none;transition:.24s}
.sw.on{background:var(--acc)}

 x=x.split(/\n{2,}/).map(function(p){p=p.trim();if(!p)return '';
   if(/^<(h1|h2|h3|ul|ol|div|hr|blockquote|table)/.test(p))return p;
   if(/^\u0000CB\d+\u0000$/.test(p))return p;
   return '<p>'+p.replace(/\n/g,'<br>')+'</p>'}).join('');

/* ══ download ══ */
function stamp(){
 var d=new Date(),z=function(n){return (n<10?'0':'')+n};
 return d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'-'+z(d.getHours())+z(d.getMinutes());
}
function dlText(text,base){
 if(!text||!text.replace(/^\s+|\s+$/g,'')){toast(s('ui_nothing'));return}
 var def=(base||'nova-'+stamp())+'.md';
 var n=prompt(s('ui_dl_name'),def);
 if(n===null)return;
 n=n.replace(/^\s+|\s+$/g,'')||def;
 if(!/\.[a-z0-9]{1,5}$/i.test(n))n+='.md';
 buzz(16);Native.download(n,text);
}
function lastAnswer(){
 var a=$('chat').querySelectorAll('.msg.ai');
 if(!a.length)return '';
 return a[a.length-1].querySelector('.bub').innerText||'';
}
function chatText(){
 var out=[],nodes=$('chat').querySelectorAll('.msg');
 if(!nodes.length)return '';
 out.push('# '+s('app_name')+' \u2014 '+new Date().toLocaleString());
 out.push('');
 for(var i=0;i<nodes.length;i++){
  var m=nodes[i],b=m.querySelector('.bub');if(!b)continue;
  out.push((m.className.indexOf('me')>0?'## '+s('ui_owner'):'## '+s('app_name')));
  out.push(b.innerText);out.push('');
 }
 return out.join('\n');
}

/* ══ project folder ══ */
function loadProject(){
 if(!Native.getProject)return;
 var cur='';
 try{cur=Native.getProject()||''}catch(e){}
 $('projpath').value=cur;
 $('projout').style.color='';
 $('projout').textContent=cur?cur:s('proj_none');
 var chips='';
 try{
  var list=JSON.parse(Native.suggestProjects()||'[]');
  list.forEach(function(pth){
   chips+='<span class="mc" data-proj="'+esc(pth)+'">'+esc(pth.split('/').pop())+'</span>'});
 }catch(e){}
 $('projchips').innerHTML=chips;
 $('projchips').querySelectorAll('[data-proj]').forEach(function(e){
  e.onclick=function(){$('projpath').value=e.getAttribute('data-proj');buzz()}});
 try{$('bAgents').style.display=Native.hasAgents()?'none':''}catch(e){}
}
function applyProject(path){
 var r='';
 try{r=Native.setProject(path)}catch(e){r=String(e)}
 var ok=r.indexOf('OK')===0;
 $('projout').style.color=ok?'var(--ok)':'var(--danger)';
 $('projout').textContent=ok?s('proj_ok')+': '+r.slice(2).trim():r;
 if(ok){buzz(18);loadProject()}
}

/* Toggle from anywhere on the row. The switch itself is a small target on a
   phone, and a tap that lands 3px outside it previously did nothing. */
['sw-tools','sw-mem','sw-tts','sw-agent'].forEach(function(i){
 var sw=$(i);
 if(!sw)return;
 var row=sw.parentNode;
 function flip(){sw.className=sw.className.indexOf('on')>0?'sw':'sw on';buzz()}
 sw.onclick=function(e){if(e&&e.stopPropagation)e.stopPropagation();flip()};
 if(row&&row.className==='row')row.onclick=flip;
});

function boot(){
 var steps=[['fill',fill],['hero',hero],['loadCfg',loadCfg]];
 for(var i=0;i<steps.length;i++){
  try{steps[i][1]()}
  catch(e){
   /* Report instead of dying quietly: a half-initialised settings panel that
      looks fine but ignores taps is far harder to diagnose than a message. */
   try{console.log('boot step '+steps[i][0]+' failed: '+e)}catch(_){}
  }
 }
}
