name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android || npx cap sync android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add missing file_paths resource
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="my_images" path="Pictures" />
              <cache-path name="my_cache" path="." />
              <files-path name="my_files" path="." />
          </paths>
          EOF

      - name: Add missing icon and theme resources
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/values
          convert -size 48x48 xc:"#4CAF50" android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert -size 48x48 xc:"#4CAF50" android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          convert -size 72x72 xc:"#4CAF50" android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert -size 72x72 xc:"#4CAF50" android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          convert -size 96x96 xc:"#4CAF50" android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert -size 96x96 xc:"#4CAF50" android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          convert -size 144x144 xc:"#4CAF50" android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert -size 144x144 xc:"#4CAF50" android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cat > android/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
              </style>
          </resources>
          EOF

      - name: Set compileSdk to 35
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/' android/variables.gradle
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/' android/variables.gradle
          fi

      - name: Fix Gradle Wrapper
        run: |
          cd android
          curl -o gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip -L
          unzip -q gradle-8.7-bin.zip
          ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
