name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install ImageMagick and Python deps
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip install requests

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android || npx cap sync android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix known Java code issues
        run: |
          find android/app/src -name "*.java" -exec sed -i 's/Log\.warn(/Log.w(/g' {} \; || true

      - name: Fix duplicate Kotlin stdlib conflict
        run: |
          python3 << 'PYEOF'
          path = "android/app/build.gradle"
          with open(path) as f:
              content = f.read()
          if "resolutionStrategy" not in content:
              fix = """
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              }
          }
          """
              content += fix
              with open(path, "w") as f:
                  f.write(content)
          PYEOF

      - name: Add missing file_paths resource
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="my_images" path="Pictures" />
              <cache-path name="my_cache" path="." />
              <files-path name="my_files" path="." />
          </paths>
          EOF

      - name: Add missing icon and theme resources
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/values
          convert -size 48x48 xc:"#4CAF50" android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert -size 48x48 xc:"#4CAF50" android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          convert -size 72x72 xc:"#4CAF50" android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert -size 72x72 xc:"#4CAF50" android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          convert -size 96x96 xc:"#4CAF50" android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert -size 96x96 xc:"#4CAF50" android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          convert -size 144x144 xc:"#4CAF50" android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert -size 144x144 xc:"#4CAF50" android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cat > android/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
              </style>
          </resources>
          EOF

      - name: Set compileSdk to 35
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/' android/variables.gradle
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/' android/variables.gradle
          fi

      - name: Fix Gradle Wrapper
        run: |
          cd android
          curl -o gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip -L
          unzip -q gradle-8.7-bin.zip
          ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7

      - name: Build APK with AI auto-fix retry
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd android
          chmod +x gradlew
          MAX_TRIES=3
          TRY=1
          while [ $TRY -le $MAX_TRIES ]; do
            echo ">> Build attempt $TRY of $MAX_TRIES"
            if ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/build_log.txt; then
              echo ">> Build succeeded on attempt $TRY"
              exit 0
            fi
            echo ">> Build failed on attempt $TRY"
            if [ $TRY -eq $MAX_TRIES ]; then
              echo ">> Max retries reached, giving up"
              exit 1
            fi
            echo ">> Asking Gemini to fix the error..."
            cd ..
            if python3 .github/scripts/ai_fix.py /tmp/build_log.txt "$(pwd)/android"; then
              echo ">> AI fix applied, retrying build"
            else
              echo ">> AI could not fix the error, giving up"
              exit 1
            fi
            cd android
            TRY=$((TRY + 1))
          done

      - name: Verify APK exists
        run: |
          if [ ! -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK not found!"
            exit 1
          fi
          echo "APK build successful!"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
